<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>生化危机模拟器 · ZOS-R</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/topbar.css" />
  <link rel="stylesheet" href="css/panel.css" />
<script>
  // 把 console.error / 运行时错误写进 title，便于无头诊断
  (function () {
    const oe = console.error.bind(console);
    console.error = function () {
      const s = Array.prototype.map.call(arguments, a => (a && a.message) ? a.message : String(a)).join(' ');
      document.title = 'CONSOLE_ERR ' + s.slice(0, 220);
      oe.apply(null, arguments);
    };
    window.addEventListener('error', e => { document.title = 'WINERR ' + (e.message || '').slice(0, 220); });
  })();
</script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<!-- 加载屏 -->
<div id="loading">
  <div class="ld-box">
    <div class="ld-title">生化危机模拟器</div>
    <div class="ld-sub">ZOMBIE OUTBREAK SIMULATOR — Remake</div>
    <div class="ld-bar"><i id="ld-fill"></i></div>
    <div class="ld-txt" id="ld-txt">初始化…</div>
  </div>
</div>

<!-- 顶栏（单行；所有尺寸用 em 跟随窗口宽度等比缩放） -->
<div id="topbar">
  <div class="tb-left">
    <span class="tb-city" id="tb-city">—</span>
    <span class="tb-sep">·</span>
    <span class="tb-clock" id="tb-clock">00:00:00</span>
  </div>
  <div class="tb-mid">
    <button class="spd" data-spd="0">⏸</button>
    <button class="spd on" data-spd="1">1×</button>
    <button class="spd" data-spd="4">4×</button>
    <button class="spd" data-spd="16">16×</button>
  </div>
  <div class="tb-group tb-pops">
    <span class="tb-stat" title="还活着的平民"><span class="tb-cap"><i class="dot civ"></i><em>平民</em></span><b id="n-civ">0</b></span>
    <span class="tb-stat" title="已感染、还没尸变的人"><span class="tb-cap"><i class="dot inf"></i><em>感染</em></span><b id="n-inf">0</b></span>
    <span class="tb-stat" title="丧尸"><span class="tb-cap"><i class="dot zomb"></i><em>丧尸</em></span><b id="n-zomb">0</b></span>
    <span class="tb-stat" title="死亡人数"><span class="tb-cap"><i class="dot dead"></i><em>死亡</em></span><b id="n-dead">0</b></span>
    <span class="tb-stat" id="tb-saved" title="已从撤离口撤离出城的人"><span class="tb-cap"><i class="dot saved"></i><em>撤离</em></span><b id="n-saved">0</b></span>
    <span class="tb-stat" id="tb-flee" title="正在逃跑的人"><span class="tb-cap"><i class="dot inf"></i><em>逃跑</em></span><b id="n-flee">0</b></span>
  </div>
  <span class="tb-div"></span>
  <div class="tb-group tb-gauges">
    <span class="tb-gauge clickable" id="g-chaos" title="混乱度 = 知情值×0.5 + 感染值×2（上限 100）· 点击查看明细">
      <span class="tg-top"><i class="dot chaos"></i><em>混乱</em><b id="n-chaos">0</b></span>
      <span class="tg-bar"><i id="bar-chaos"></i></span>
    </span>
    <span class="tb-gauge clickable" id="g-infect" title="感染率 = 已感染人数 / 总人口 · 点击查看明细">
      <span class="tg-top"><i class="dot inf"></i><em>感染</em><b id="n-infect">0%</b></span>
      <span class="tg-bar"><i id="bar-infect"></i></span>
    </span>
    <span class="tb-gauge clickable" id="g-aware" title="知道出事了的人 · 点击查看明细">
      <span class="tg-top"><i class="dot info"></i><em>知情</em><b id="n-aware">0%</b></span>
      <span class="tg-bar"><i id="bar-aware"></i></span>
    </span>
  </div>
  <span class="tb-div"></span>
  <div class="tb-tools" id="tb-tools">
    <button class="tb-btn" id="btn-force" title="武力状态明细">武力</button>
    <button class="tb-btn" id="btn-sanit" title="卫生状态明细">卫生</button>
    <button class="tb-btn" id="btn-overview" title="全体人员总览（O）">总览</button>
    <button class="tb-btn" id="btn-report" title="结算本局">战报</button>
  </div>
  <span class="tb-fps" id="fps">—</span>
</div>

<!-- 参数面板 -->
<div id="panel">
  <div class="p-head">
    <span>爆发参数</span>
    <button id="p-toggle">—</button>
  </div>
  <div class="p-body" id="p-body">
    <label class="p-row"><span>平民人口</span><input type="range" id="s-pop" min="200" max="100000" step="1" value="20000"><b id="v-pop">20,000</b></label>
    <label class="p-row"><span>初始丧尸</span><input type="range" id="s-z0" min="1" max="10000" step="1" value="1000"><b id="v-z0">120</b></label>
    <label class="p-row"><span>家庭持枪率</span><input type="range" id="s-arm" min="0" max="100" step="1" value="10"><b id="v-arm">10%</b></label>
    <label class="p-row"><span>警察数量</span><input type="range" id="s-pol" min="0" max="10000" step="1" value="1000"><b id="v-pol">60</b></label>
    <div class="p-row p-segrow">
      <span>地图</span>
      <div class="seg" id="seg-map">
        <button data-map="sat" class="on">卫星</button>
        <button data-map="vec">矢量</button>
      </div>
    </div>
    <div class="p-row p-segrow">
      <span>3D 建筑</span>
      <div class="seg" id="seg-bld">
        <button data-bld="1" class="on">显示</button>
        <button data-bld="0">隐藏</button>
      </div>
    </div>
    <div class="p-sec">信息传播</div>
    <label class="p-row"><span>传播速度</span><input type="range" id="s-info" min="0.2" max="2" step="0.1" value="1"><b id="v-info">1.0×</b></label>
    <div class="p-hint2">电话（家人优先）+ 网络。调大 → 城市更快知道、更早逃。</div>
    <div class="p-sec">爆发模式</div>
    <label class="p-row"><span>模式</span>
      <select id="sel-mode" class="p-sel">
        <option value="single">单点爆发</option>
        <option value="invade">僵尸入侵（定向）</option>
        <option value="multi">多点爆发</option>
        <option value="stealth">零号病人（长潜伏 10–30 分）</option>
        <option value="waves">连环爆发</option>
        <option value="apocalypse">末日降临（全城）</option>
      </select></label>
    <div id="mode-opts"></div>
    <div class="p-sec">操作</div>
    <div class="p-btns">
      <button id="btn-restart" class="primary">重新爆发</button>
      <button id="btn-seed">换种子</button>
    </div>
    <div class="p-hint">
      右键拖拽平移 · 滚轮缩放 · 中键拖拽旋转/俯仰<br>
      W A S D 平移 · Q E 旋转 · R F 俯仰 · M 卫星/矢量 · B 建筑<br>
      底部工具栏选工具 → 点地面投放（快捷键 1-9 0 - =）
    </div>
  </div>
</div>

<div id="poilabels"></div>

<!-- 个体档案卡 -->
<div id="agentcard" class="hidden">
  <div class="ac-head">
    <button class="ac-nav" id="ac-prev" title="上一个">‹</button>
    <span class="ac-name" id="ac-name">—</span>
    <span class="ac-vip" id="ac-vip">★ 要员</span>
    <button class="ac-nav" id="ac-next" title="下一个">›</button>
    <button id="ac-close">✕</button>
  </div>
  <div class="ac-sub" id="ac-sub">—</div>
  <div id="ac-body"></div>
  <div class="ac-foot">
    <button id="ac-follow">跟随镜头</button>
    <button id="ac-back" class="hidden">← 返回角色</button>
  </div>
</div>

<!-- 指挥工具栏 -->
<div id="toolbar">
  <div class="bud">
    <b id="budget">100万</b>
    <span>可用经费 ¥</span>
    <i class="budbar"><u id="budfill"></u></i>
  </div>
  <div class="tools" id="tools"></div>
</div>

<!-- 结局横幅 -->
<div id="nighttint"></div>
<div id="banner" class="hidden"><span id="banner-txt"></span></div>

<script type="module" src="js/main.js"></script>

</body>
</html>
