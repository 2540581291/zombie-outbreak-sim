<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>T</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<script type="module">
import * as THREE from 'three';
import { buildCity } from './js/city.js';

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222c38);
const cam = new THREE.PerspectiveCamera(52, W / H, 1, 20000);

const sun = new THREE.DirectionalLight(0xfff0dd, 1.5); sun.position.set(-500, 900, 600); scene.add(sun);
scene.add(new THREE.HemisphereLight(0x93b3d6, 0x1a1c18, 0.85));

const city = await (await fetch('data/city.json')).json();
const t0 = performance.now();
const { group, buildingMat } = buildCity(city);
const t1 = performance.now();
scene.add(group);

const c0 = group.children[0];
const pa = c0?.geometry?.attributes?.position;
document.title = `gc=${group.children.length} v=${pa ? pa.count : -1} build=${(t1 - t0).toFixed(0)}ms`;

// 固定相机：城市中心，斜俯视
cam.position.set(400, 700, 500);
cam.lookAt(0, 0, 0);

buildingMat.uniforms.uCam.value.copy(cam.position);
buildingMat.uniforms.uNight.value = 0.35;
buildingMat.uniforms.uFog.value.set(0x222c38);
buildingMat.uniforms.uFogNear.value = 900;
buildingMat.uniforms.uFogFar.value = 5200;

renderer.render(scene, cam);
document.title += ' tris=' + renderer.info.render.triangles + ' calls=' + renderer.info.render.calls;
</script>
</body></html>
