<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>GPU / 纹理上限实测</title>
<style>
  body { background:#12161b; color:#cfd6dd; font:13px/1.7 "Segoe UI",system-ui,sans-serif; padding:24px 32px; }
  h1 { font-size:16px; letter-spacing:.08em; color:#eef3f8; }
  table { border-collapse:collapse; margin-top:14px; }
  td,th { padding:5px 14px; border-bottom:1px solid #232a33; text-align:left; }
  th { color:#7d8794; font-weight:500; }
  .ok { color:#5fd97a; } .bad { color:#ff6b5e; } .warn { color:#f0c040; }
  #info { color:#8b97a5; margin-top:10px; font-size:12px; }
  pre { background:#0c0f13; padding:12px; border-radius:6px; color:#9fb0c0; overflow:auto; }
</style>
</head>
<body>
<h1>纹理 / 解码上限实测</h1>
<div id="info">正在检测…</div>
<table id="t"><thead><tr><th>尺寸</th><th>像素</th><th>显存</th><th>纹理分配</th><th>画布上传</th></tr></thead><tbody></tbody></table>
<pre id="log"></pre>

<script>
const gl = (() => {
  const c = document.createElement('canvas');
  return c.getContext('webgl2') || c.getContext('webgl');
})();
const logEl = document.getElementById('log');
const tb = document.querySelector('#t tbody');
const info = document.getElementById('info');

if (!gl) {
  info.textContent = '无法创建 WebGL 上下文';
} else {
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  const renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  const MAXTEX = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  const MAXRB = gl.getParameter(gl.MAX_RENDERBUFFER_SIZE);
  const MAXVIEW = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
  info.innerHTML = `<b>${renderer}</b><br>
    MAX_TEXTURE_SIZE = <b>${MAXTEX}</b> &nbsp;|&nbsp;
    MAX_RENDERBUFFER_SIZE = <b>${MAXRB}</b> &nbsp;|&nbsp;
    MAX_VIEWPORT = <b>${MAXVIEW[0]}×${MAXVIEW[1]}</b>`;

  // 与地图形状一致的比例（3302:2586 ≈ 1.277）
  const RATIO = 1.277;
  const tests = [16384, 20000, 24576, 28000, 30000, 32768].map(w => [w, Math.round(w / RATIO)]);

  // A: 只分配纹理存储（走驱动，不经过 canvas）
  function allocTex(w, h) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const err = gl.getError();
    gl.deleteTexture(tex);
    return err;
  }
  // B: 从 canvas 上传（受画布尺寸上限约束）
  function alloc(w, h) {
    const t0 = performance.now();
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    // 用一张同尺寸的 canvas 真实上传，而不是空指针
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const cx = c.getContext('2d');
    const grad = cx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, '#204060'); grad.addColorStop(1, '#e0a040');
    cx.fillStyle = grad; cx.fillRect(0, 0, w, h);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
    const err = gl.getError();
    gl.deleteTexture(tex);
    return { ok: err === 0, err, ms: performance.now() - t0 };
  }

  let best = 0;
  for (const [w, h] of tests) {
    const px = w * h;
    const gb = px * 4 / 1024 ** 3;
    let eA = -1, eB = 'skip';
    try { eA = allocTex(w, h); } catch (e) { eA = 'throw'; }
    let r = { ok: false, ms: 0 };
    try { r = alloc(w, h); eB = r.ok ? 'ok' : String(r.err); } catch (e) { eB = 'throw'; }
    const okA = eA === 0;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${w} × ${h}</td><td>${(px / 1e6).toFixed(0)} MP</td>
      <td>${gb.toFixed(2)} GB</td>
      <td class="${okA ? 'ok' : 'bad'}">${okA ? '✓' : '✗ ' + eA}</td>
      <td class="${eB === 'ok' ? 'ok' : 'bad'}">${eB === 'ok' ? '✓' : '✗ ' + eB}</td>`;
    tb.appendChild(tr);
    if (okA) best = Math.max(best, px);
  }

  logEl.textContent =
    `可用的最大单张纹理：约 ${(best / 1e6).toFixed(0)} MP ` +
    `(短边约 ${Math.round(Math.sqrt(best / RATIO))} px, 长边 ${Math.round(Math.sqrt(best * RATIO))} px)\n` +
    `对应本城市（3302×2586 m）的分辨率：${(3302 / Math.sqrt(best * RATIO)).toFixed(4)} m/px\n` +
    `显存估算（含 mipmap ×1.34）：${(best * 4 * 1.34 / 1024 ** 3).toFixed(2)} GB\n` +
    `注意：这里只测「纹理上传」，不含 JPEG 解码。若某尺寸上传成功但页面加载仍失败，说明卡在解码，不是显存。`;
}
</script>
</body>
</html>
